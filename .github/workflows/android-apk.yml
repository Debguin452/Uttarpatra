name: android-apk
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName shown to users (e.g. 1.0.3). Leave blank to keep 1.0."
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: "pnpm" }

      - run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm build:web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
          VITE_TURNSTILE_SITEKEY: ${{ vars.VITE_TURNSTILE_SITEKEY }}
          VITE_UPI_ID: ${{ vars.VITE_UPI_ID }}
          VITE_UPI_PAYEE: ${{ vars.VITE_UPI_PAYEE }}

      - name: Sync into the Android project
        working-directory: apps/web
        run: npx cap sync android

      - name: Set versionName
        if: ${{ inputs.version_name != '' }}
        working-directory: apps/web/android/app
        run: sed -i "s/versionName \".*\"/versionName \"${{ inputs.version_name }}\"/" build.gradle

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      # ubuntu-latest ships the Android SDK/build-tools preinstalled —
      # see actions/runner-images — so no separate SDK setup action.

      - name: Decode release keystore
        id: signing
        working-directory: apps/web/android
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
            cat > app/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        working-directory: apps/web/android
        run: |
             chmod +x gradlew
             ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        if: steps.signing.outputs.has_keystore == 'true'
        working-directory: apps/web/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Print signing certificate fingerprints
        working-directory: apps/web/android
        # Diagnostic only — never fails the job (APK upload below is what
        # actually matters), and doesn't assume a particular keytool output
        # format or keystore path.
        continue-on-error: true
        run: |
          set +e
          print_fingerprints() {
            local label="$1" keystore="$2" storepass="$3" alias="$4"
            echo "# $label:"
            if [ ! -f "$keystore" ]; then
              echo "  (no keystore found at $keystore — skipping)"
              return
            fi
            local out
            out=$(keytool -list -v -keystore "$keystore" -storepass "$storepass" -alias "$alias" 2>&1)
            local hits
            hits=$(echo "$out" | grep -iE "SHA-?1:|SHA-?256:")
            if [ -n "$hits" ]; then
              echo "$hits"
            else
              echo "  Couldn't find a SHA1/SHA256 line automatically — full keytool output below:"
              echo "$out"
            fi
          }

          echo "# Add the SHA-1 below to: Firebase console > Project settings >"
          echo "# Your apps > com.uttarpatra.app > Add fingerprint."
          echo ""
          print_fingerprints "Debug keystore (signs app-debug.apk)" "$HOME/.android/debug.keystore" android androiddebugkey
          if [ "${{ steps.signing.outputs.has_keystore }}" = "true" ]; then
            echo ""
            print_fingerprints "Release keystore (signs app-release.apk)" app/release.keystore \
              "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" "${{ secrets.ANDROID_KEY_ALIAS }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.has_keystore == 'true'
        with:
          name: app-release
          path: apps/web/android/app/build/outputs/apk/release/app-release.apk

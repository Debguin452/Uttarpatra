name: usage-alert
on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check Cloudflare + Firestore usage against free-tier caps
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WHATSAPP_ALERT_URL: ${{ secrets.WHATSAPP_ALERT_URL }}
        run: node infra/scripts/usage-check.mjs
        # Script (to be filled in Phase 1): pulls today's Workers request
        # count and D1 row-read/write counts via the GraphQL analytics
        # API, and Firestore usage via the Cloud Monitoring API, then
        # posts a wa.me-style alert at 70% and 90% of each daily cap.

name: usage-alert
on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check Cloudflare + Firestore usage against free-tier caps
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WHATSAPP_ALERT_URL: ${{ secrets.WHATSAPP_ALERT_URL }}
        run: node infra/scripts/usage-check.mjs
        # Pulls today's Workers request count and D1 row-read/write counts
        # via the Cloudflare GraphQL Analytics API, and alerts through
        # WHATSAPP_ALERT_URL at 70% and 90% of each daily free-tier cap.
        # Firestore usage is NOT covered here: that needs a GCP service
        # account key, which isn't among the secrets wired up yet.

name = "coaching-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "coaching_db"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "../../db/migrations"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionGuard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionGuard"]

[vars]
FIREBASE_PROJECT_ID = "your-firebase-project-id"
ALLOWED_ORIGIN = "http://localhost:5173,https://coaching-app.pages.dev"

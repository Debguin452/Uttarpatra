name = "coach"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "database"
database_id = "0aebc296-b47b-4f38-bbbe-57f8bbe622ba"
migrations_dir = "../../db/migrations"

# Cloudflare Workers AI: no API key, billed per token after the free daily
# allowance (10,000 neurons/day). The limits below keep spend predictable.
[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionGuard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionGuard"]

[vars]
FIREBASE_PROJECT_ID = "uttar-patra"
ALLOWED_ORIGIN = "http://localhost:5173,https://uttarpatro.pages.dev,https://uttarpatra.pages.dev,https://localhost"
# Switch model here without a code change, e.g. "@cf/openai/gpt-oss-120b" for better Bengali.
AI_MODEL = "@cf/openai/gpt-oss-20b"
AI_USER_DAILY_LIMIT = "12"
AI_TEACHER_DAILY_LIMIT = "40"
AI_GLOBAL_DAILY_LIMIT = "400"

[triggers]
crons = ["* * * * *"]

# Push notifications also need a secret (not set in this file):
#   wrangler secret put FCM_SERVICE_ACCOUNT_JSON
# — paste the full contents of a Firebase service-account JSON key
# (Firebase console -> Project settings -> Service accounts -> Generate new
# private key). Without it, sendPushToUids() no-ops silently.
